services:
  mongodb:
    image: mongo:8
    container_name: nammongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: .
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mongo_data:
    external: true
    name: product_mongo_data