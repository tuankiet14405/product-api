name: Product CI Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run basic tests
        run: npm test

      - name: Build and wait for healthy services
        run: |
          docker compose -f docker-compose-ci.yaml up \
            -d --build --wait --wait-timeout 180

      - name: Run CRUD integration tests
        run: npm run test:integration

      - name: Show status and logs
        if: always()
        run: |
          docker compose -f docker-compose-ci.yaml ps
          docker compose -f docker-compose-ci.yaml logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose-ci.yaml down -v